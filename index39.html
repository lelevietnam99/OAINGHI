<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>21. Xuất Gia, Thọ Giới, Nhập Viện - b. Thọ Giới</title>
    <style>
        /* Thiết lập nền vũ trụ cho toàn trang */
        body, html {
            margin: 0;
            padding: 0;
            min-height: 100vh;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background-image: url('https://images.unsplash.com/photo-1506703719100-a0f3a48c0f86?q=80&w=2500&auto=format&fit=crop');
            background-size: cover;
            background-position: center;
            background-attachment: fixed;
            color: #f1f1f1;
            display: flex;
            justify-content: center;
            align-items: center;
        }

        /* Khung chứa nội dung mờ ảo để dễ đọc chữ */
        .container {
            background-color: rgba(10, 15, 30, 0.85); /* Nền tối bán trong suốt */
            backdrop-filter: blur(8px); /* Hiệu ứng kính mờ */
            max-width: 900px;
            padding: 45px 55px;
            margin: 40px 20px;
            border-radius: 15px;
            box-shadow: 0 10px 40px rgba(0, 0, 0, 0.7);
            border: 1px solid rgba(255, 255, 255, 0.15);
            line-height: 1.8;
            font-size: 1.1rem;
        }

        .quote-box {
            margin: 25px 0;
            background-color: rgba(255, 255, 255, 0.04);
            padding: 30px;
            border-radius: 8px;
            border-left: 4px solid #ffd700;
            text-align: justify;
            line-height: 1.8;
        }

        h2 {
            color: #ffd700;
            text-align: center;
            font-family: serif;
            margin-top: 0;
            margin-bottom: 20px;
            border-bottom: 1px solid rgba(255, 255, 255, 0.2);
            padding-bottom: 10px;
        }

        .highlight {
            color: #ffd700;
            font-weight: bold;
        }

        /* Hiệu ứng thanh cuộn đẹp mắt */
        ::-webkit-scrollbar {
            width: 10px;
        }
        ::-webkit-scrollbar-track {
            background: rgba(0, 0, 0, 0.3); 
        }
        ::-webkit-scrollbar-thumb {
            background: rgba(255, 255, 255, 0.3); 
            border-radius: 5px;
        }
        ::-webkit-scrollbar-thumb:hover {
            background: rgba(255, 255, 255, 0.6); 
        }

        /* Responsive cho điện thoại */
        @media (max-width: 600px) {
            .container {
                padding: 25px;
                font-size: 1rem;
            }
        }
    </style>
</head>
<body>

    <div class="container">
        <h2>21. XUẤT GIA, THỌ GIỚI, NHẬP VIỆN<br><span style="font-size: 1.2rem; font-weight: normal;">b. Thọ Giới</span></h2>
        <div class="quote-box">
            Khi cần thiết, Tu viện cũng tổ chức Giới đàn nội bộ để truyền Giới khi Trụ trì nhận thấy có những Tu sĩ đủ tư cách để thọ thêm Giới Pháp trong khi tại các nơi khác không mở Giới đàn.<br><br>
            <span class="highlight">Sau khi thọ Giới, Tu sĩ phải tác bạch Đại chúng.</span>
        </div>
    </div>

</body>
</html>
